name: Publish Homebrew Formula

# Manual fallback for re-rendering the zsass formula in
# nihen/homebrew-tap (e.g. to recover from a failed tap push without
# cutting a fresh release). The standard chain runs as the `homebrew`
# job inside release.yml; that path is preferred for normal releases.
#
# Requires repo secret HOMEBREW_TAP_TOKEN: a token (PAT or fine-grained)
# with `contents: write` on nihen/homebrew-tap. The job is a no-op when
# the secret is absent so the first-time introduction does not fail.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish (e.g. 0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target version
        id: version
        shell: bash
        # The input reaches the script through the environment, never as
        # text substituted into it.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          raw="${INPUT_VERSION}"
          version="${raw#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Unexpected version '${raw}' (need semver)"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Check tap token availability
        id: token
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "${HOMEBREW_TAP_TOKEN}" ]]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping tap update."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout zsass (renderer source)
        if: steps.token.outputs.skip != 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          path: zsass
          persist-credentials: false

      - name: Checkout nihen/homebrew-tap
        if: steps.token.outputs.skip != 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        # The credentials stay: the last step pushes the formula with them.
        with:
          repository: nihen/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      # The formula pins the archives' sha256. Take them only from archives
      # that carry the release workflow's signature for this tag.
      - name: Install cosign
        if: steps.token.outputs.skip != 'true'
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9  # v3
        with:
          cosign-release: 'v2.4.1'

      - name: Verify the release archives
        if: steps.token.outputs.skip != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION}"
          assets=()
          for target in macos-aarch64 macos-x86_64 linux-aarch64 linux-x86_64; do
            assets+=("zsass-v${version}-${target}.tar.gz")
          done
          zsass/scripts/verify-release-assets.sh "v${version}" "${assets[@]}" \
            > "${RUNNER_TEMP}/verified-sha256.txt"

      - name: Render formula
        if: steps.token.outputs.skip != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p homebrew-tap/Formula
          zsass/scripts/render-homebrew-formula.sh "${VERSION}" \
            --verified "${RUNNER_TEMP}/verified-sha256.txt" \
            --output homebrew-tap/Formula/zsass.rb

      - name: Commit and push
        if: steps.token.outputs.skip != 'true'
        shell: bash
        working-directory: homebrew-tap
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/zsass.rb
          if git diff --cached --quiet -- Formula/zsass.rb; then
            echo "Formula already up to date; nothing to commit."
            exit 0
          fi
          git commit -m "zsass ${VERSION}"
          git push origin HEAD
